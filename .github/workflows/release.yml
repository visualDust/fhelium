name: Release FHElium

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build and verify artifacts, or publish after verification
        required: true
        default: build-only
        type: choice
        options: [build-only, publish]
      build_scope:
        description: Build the complete matrix or only the Windows matrix
        required: true
        default: all
        type: choice
        options: [all, windows-only]
      source_ref:
        description: Branch, commit SHA, or tag to build in build-only mode
        required: false
        default: testing
        type: string
      tag:
        description: Existing release tag required only in publish mode
        required: false
        default: ''
        type: string
      initialize_configurations:
        description: Comma-separated configuration roots allowed to be new and absent
        required: false
        default: ''
        type: string
run-name: FHElium ${{ inputs.mode }} ${{ inputs.build_scope }} ${{ inputs.mode == 'publish' && inputs.tag || inputs.source_ref }}

permissions:
  contents: read

concurrency:
  group: fhelium-release
  cancel-in-progress: false

env:
  RELEASE_OUTPUT: ${{ github.workspace }}/release-output

jobs:
  resolve-source:
    runs-on: [self-hosted, linux, x64, fhelium-release, gpu]
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_commit: ${{ steps.version.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.mode == 'publish' && inputs.tag || inputs.source_ref }}
          fetch-depth: 0
      - name: Validate source identity and matrix
        id: version
        shell: bash
        env:
          BUILD_SCOPE: ${{ inputs.build_scope }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          source_commit=$(git rev-parse HEAD)
          if [ "$RELEASE_MODE" = publish ]; then
            if [ "$BUILD_SCOPE" != all ]; then
              echo 'publish mode requires build_scope=all' >&2
              exit 1
            fi
            if [ -z "$RELEASE_TAG" ]; then
              echo 'publish mode requires tag' >&2
              exit 1
            fi
            version=$(python packaging/release_identity.py \
              --tag "$RELEASE_TAG" \
              --source-commit "$source_commit" \
              --remote origin)
          else
            if [ -z "$SOURCE_REF" ]; then
              echo 'build-only mode requires source_ref' >&2
              exit 1
            fi
            version=$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              print(tomllib.load(stream)["project"]["version"])
          PY
            )
          fi
          printf 'version=%s\nsource_commit=%s\n' \
            "$version" "$source_commit" >> "$GITHUB_OUTPUT"
          python -m pip install "jsonschema==4.26.0" "scikit-build-core==1.0.3"
          python -I packaging/matrix.py validate

  verify-project:
    if: inputs.build_scope == 'all'
    needs: resolve-source
    runs-on: [self-hosted, linux, x64, fhelium-release, gpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-source.outputs.source_commit }}
          fetch-depth: 0
      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail
          configuration=$(python -I packaging/matrix.py show torch213-cu130)
          torch_requirement=$(python -c \
            'import json,sys; print(json.load(sys.stdin)["torch_requirement"])' \
            <<<"$configuration")
          torch_index_url=$(python -c \
            'import json,sys; print(json.load(sys.stdin)["torch_index_url"])' \
            <<<"$configuration")
          python -m pip install --index-url "$torch_index_url" "$torch_requirement"
          python -m pip install --group dev --no-build-isolation
          python -m pip install --editable . --no-build-isolation --no-cache-dir
          python -m ruff check fhelium tests examples scripts packaging
          python -m ruff format --check fhelium tests examples scripts packaging
          python -m pyright
          python -m pytest -q
          python -m pytest packaging/test_release_repository.py -q
          npm --prefix docs ci
          npm --prefix docs run build
          git diff --check

  build-linux:
    if: inputs.build_scope == 'all'
    needs: resolve-source
    runs-on: [self-hosted, linux, x64, fhelium-release, gpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-source.outputs.source_commit }}
          fetch-depth: 0
      - name: Build Linux wheels
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RELEASE_OUTPUT"
          python -m pip install "jsonschema==4.26.0"
          docker build --file packaging/manylinux_2_28.Dockerfile \
            --tag fhelium-manylinux-cpu .
          docker build --file packaging/manylinux_2_28_cuda12_9.Dockerfile \
            --tag fhelium-manylinux-cuda-12.9 .
          docker build --file packaging/manylinux_2_28_cuda13.Dockerfile \
            --tag fhelium-manylinux-cuda-13.0 .
          work_root="$RUNNER_TEMP/fhelium-linux-release-build"
          python -I packaging/matrix.py cells \
            --platform manylinux_2_28_x86_64 |
          while read -r configuration platform python_abi; do
            python packaging/build_wheel.py \
              --platform "$platform" \
              --configuration "$configuration" \
              --python-abi "$python_abi" \
              --work-root "$work_root" \
              --output "$RELEASE_OUTPUT" \
              --verify-install
          done
      - name: Build source distribution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "build==1.5.0" "twine==6.2.0"
          python -m build --sdist --no-isolation --outdir "$RELEASE_OUTPUT/sdist"
          python -m twine check "$RELEASE_OUTPUT"/sdist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fhelium-linux-${{ needs.resolve-source.outputs.source_commit }}
          path: ${{ env.RELEASE_OUTPUT }}/**
          if-no-files-found: error
          retention-days: 30

  build-windows:
    needs: resolve-source
    runs-on: [self-hosted, Windows, X64, fhelium-release, gpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-source.outputs.source_commit }}
          fetch-depth: 0
      - name: Build Windows wheels
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force $env:RELEASE_OUTPUT -ErrorAction SilentlyContinue
          function Resolve-Python([string] $version) {
            $installKeys = @(
              "Registry::HKEY_LOCAL_MACHINE\Software\Python\PythonCore\$version\InstallPath",
              "Registry::HKEY_CURRENT_USER\Software\Python\PythonCore\$version\InstallPath"
            )
            foreach ($installKey in $installKeys) {
              if (-not (Test-Path $installKey)) { continue }
              $installRoot = (Get-Item $installKey).GetValue('')
              $candidate = Join-Path $installRoot 'python.exe'
              if (-not (Test-Path $candidate -PathType Leaf)) { continue }
              & $candidate -I -c `
                'import platform,sys; expected=sys.argv[1]; actual=str(sys.version_info.major)+chr(46)+str(sys.version_info.minor); raise SystemExit(0 if actual == expected and platform.machine().upper() == sys.argv[2] else 1)' `
                $version AMD64
              if ($LASTEXITCODE -eq 0) {
                return $candidate
              }
            }
            throw "CPython $version AMD64 is not registered for this runner"
          }
          $py312 = Resolve-Python '3.12'
          $py313 = Resolve-Python '3.13'
          $physicalWorkRoot = Join-Path $env:RUNNER_TEMP `
            'fhelium-windows-release-build'
          New-Item -ItemType Directory -Force $physicalWorkRoot | Out-Null
          $workDrive = 'W:'
          if (Test-Path "$workDrive\") {
            throw "$workDrive is already in use"
          }
          & subst.exe $workDrive $physicalWorkRoot
          if ($LASTEXITCODE -ne 0) { throw 'failed to map the build root' }
          $workRoot = "$workDrive\"
          try {
            Remove-Item -Recurse -Force "$workRoot*" `
              -ErrorAction SilentlyContinue
            $matrixEnvironment = Join-Path $workRoot 'matrix-environment'
            & $py312 -I -m venv --copies $matrixEnvironment
            if ($LASTEXITCODE -ne 0) {
              throw 'failed to create the matrix environment'
            }
            $matrixPython = Join-Path $matrixEnvironment 'Scripts\python.exe'
            & $matrixPython -I -m pip install --only-binary=:all: `
              'jsonschema==4.26.0'
            if ($LASTEXITCODE -ne 0) {
              throw 'failed to install the matrix validator'
            }
            $cellsJson = & $matrixPython -I packaging/matrix.py cells `
              --platform win_amd64 --json
            if ($LASTEXITCODE -ne 0) {
              throw 'failed to read the Windows release cells'
            }
            $cells = $cellsJson | ConvertFrom-Json
            Remove-Item -Recurse -Force $matrixEnvironment
            foreach ($cell in $cells) {
              $python = if ($cell.python_abi -eq 'cp312-cp312') {
                $py312
              } else {
                $py313
              }
              & $python -I packaging/build_wheel.py `
                --platform win_amd64 `
                --configuration $cell.configuration `
                --python-abi $cell.python_abi `
                --python $python `
                --work-root $workRoot `
                --output $env:RELEASE_OUTPUT `
                --verify-install
              if ($LASTEXITCODE -ne 0) {
                throw "Windows cell failed: $($cell.configuration) $($cell.python_abi)"
              }
            }
            Remove-Item -Recurse -Force "$workRoot*" `
              -ErrorAction SilentlyContinue
          } finally {
            & subst.exe $workDrive /D
            if ($LASTEXITCODE -ne 0) {
              throw 'failed to remove the build-root mapping'
            }
          }
          Remove-Item -Recurse -Force $physicalWorkRoot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fhelium-windows-${{ needs.resolve-source.outputs.source_commit }}
          path: ${{ env.RELEASE_OUTPUT }}/**
          if-no-files-found: error
          retention-days: 30

  prepare-release:
    if: inputs.build_scope == 'all'
    needs: [resolve-source, verify-project, build-linux, build-windows]
    runs-on: [self-hosted, linux, x64, fhelium-release, gpu]
    outputs:
      version: ${{ needs.resolve-source.outputs.version }}
      source_commit: ${{ needs.resolve-source.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-source.outputs.source_commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fhelium-*-${{ needs.resolve-source.outputs.source_commit }}
          path: ${{ env.RELEASE_OUTPUT }}
          merge-multiple: true
      - name: Prepare repository candidate
        shell: bash
        env:
          INITIALIZE_CONFIGURATIONS: ${{ inputs.initialize_configurations }}
        run: |
          set -euo pipefail
          python -m pip install "jsonschema==4.26.0" "packaging==26.3"
          python packaging/prepare_release.py \
            --input "$RELEASE_OUTPUT" \
            --output "$RELEASE_OUTPUT/prepared-site" \
            --prepared-at "$(git show -s --format=%cI HEAD)"
          merge_args=()
          IFS=',' read -ra initial_roots <<< "$INITIALIZE_CONFIGURATIONS"
          for configuration in "${initial_roots[@]}"; do
            configuration=${configuration//[[:space:]]/}
            if [ -n "$configuration" ]; then
              merge_args+=(--allow-missing-configuration "$configuration")
            fi
          done
          python packaging/merge_repository.py \
            "$RELEASE_OUTPUT/prepared-site" "${merge_args[@]}"
          python packaging/repository_check.py \
            "$RELEASE_OUTPUT/prepared-site" --source-commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fhelium-${{ needs.resolve-source.outputs.source_commit }}
          path: |
            ${{ env.RELEASE_OUTPUT }}/sdist/*
            ${{ env.RELEASE_OUTPUT }}/prepared-site/**
          if-no-files-found: error
          retention-days: 30

  publish:
    if: inputs.mode == 'publish'
    needs: prepare-release
    runs-on: [self-hosted, linux, x64, fhelium-release, gpu]
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare-release.outputs.source_commit }}
          fetch-depth: 0
      - name: Restore release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fhelium-${{ needs.prepare-release.outputs.source_commit }}
          path: ${{ env.RELEASE_OUTPUT }}
      - name: Install publication clients
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "awscli==1.46.0" \
            "jsonschema==4.26.0" \
            "twine==6.2.0"
      - name: Validate restored repository
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.source_commit }}
        run: |
          set -euo pipefail
          python packaging/release_identity.py \
            --tag "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --remote origin
          python packaging/repository_check.py \
            "$RELEASE_OUTPUT/prepared-site" \
            --source-commit "$(git rev-parse HEAD)"
          python -m twine check "$RELEASE_OUTPUT"/sdist/*
      - name: Validate public Simple Repository routing
        shell: bash
        env:
          INITIALIZE_CONFIGURATIONS: ${{ inputs.initialize_configurations }}
        run: |
          set -euo pipefail
          probe_args=(--expect-subset "$RELEASE_OUTPUT/prepared-site")
          IFS=',' read -ra initial_roots <<< "$INITIALIZE_CONFIGURATIONS"
          for configuration in "${initial_roots[@]}"; do
            configuration=${configuration//[[:space:]]/}
            if [ -n "$configuration" ]; then
              probe_args+=(--allow-missing-configuration "$configuration")
            fi
          done
          python packaging/repository_probe.py "${probe_args[@]}"
      - name: Publish immutable release objects to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          FHELIUM_R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          FHELIUM_R2_BUCKET: ${{ vars.R2_BUCKET }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.source_commit }}
        run: |
          set -euo pipefail
          python packaging/release_identity.py \
            --tag "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --remote origin
          python packaging/publish_release.py \
            "$RELEASE_OUTPUT/prepared-site" \
            --phase artifacts
          python packaging/artifact_probe.py \
            "$RELEASE_OUTPUT/prepared-site/release-manifest.json"
      - name: Validate PyPI release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.source_commit }}
        run: |
          set -euo pipefail
          python packaging/release_identity.py \
            --tag "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --remote origin
          python packaging/pypi_probe.py \
            "$RELEASE_OUTPUT"/sdist/fhelium-*.tar.gz \
            --allow-missing
      - name: Publish source distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-output/sdist/
          print-hash: true
          skip-existing: true
      - name: Verify PyPI release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.source_commit }}
        run: |
          set -euo pipefail
          python packaging/release_identity.py \
            --tag "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --remote origin
          python packaging/pypi_probe.py \
            "$RELEASE_OUTPUT"/sdist/fhelium-*.tar.gz \
            --attempts 24 \
            --interval 5
      - name: Publish cumulative Simple Repository indexes
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          FHELIUM_R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          FHELIUM_R2_BUCKET: ${{ vars.R2_BUCKET }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.source_commit }}
        run: |
          set -euo pipefail
          python packaging/release_identity.py \
            --tag "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --remote origin
          python packaging/publish_release.py \
            "$RELEASE_OUTPUT/prepared-site" \
            --phase indexes
      - name: Verify public package indexes
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.prepare-release.outputs.version }}'
          for configuration in \
            torch213-cu130 torch212-cu129 torch213-cpu torch212-cpu; do
            configuration_json=$(
              python packaging/matrix.py show "$configuration"
            )
            torch_requirement=$(python -c \
              'import json,sys; print(json.load(sys.stdin)["torch_requirement"])' \
              <<<"$configuration_json")
            torch_index_url=$(python -c \
              'import json,sys; print(json.load(sys.stdin)["torch_index_url"])' \
              <<<"$configuration_json")
            expected_backends=$(python -c \
              'import json,sys; print(",".join(json.load(sys.stdin)["native_backends"]))' \
              <<<"$configuration_json")
            expected_torch=$(python -c \
              'import json,sys; print(json.load(sys.stdin)["torch_runtime_version"])' \
              <<<"$configuration_json")
            for python_abi in cp312-cp312 cp313-cp313; do
              case "$python_abi" in
                cp312-cp312) python_bin=python3.12 ;;
                cp313-cp313) python_bin=python3.13 ;;
              esac
              environment="$RUNNER_TEMP/public-$configuration-$python_abi"
              rm -rf "$environment"
              "$python_bin" -m venv "$environment"
              "$environment/bin/python" -m pip install \
                --index-url "$torch_index_url" \
                "$torch_requirement"
              for attempt in $(seq 1 24); do
                if "$environment/bin/python" -m pip install \
                  --only-binary=fhelium \
                  --extra-index-url \
                  "https://download.fhelium.550w.host/$configuration/simple/" \
                  "fhelium==$version"; then
                  break
                fi
                test "$attempt" -lt 24
                sleep 10
              done
              EXPECTED_BACKENDS="$expected_backends" \
              EXPECTED_TORCH="$expected_torch" \
              EXPECTED_VERSION="$version" \
                "$environment/bin/python" -I - <<'PY'
          import os

          import torch
          import fhelium
          from fhelium.native import native_status

          assert fhelium.__version__ == os.environ["EXPECTED_VERSION"]
          assert str(torch.__version__) == os.environ["EXPECTED_TORCH"]
          status = native_status()
          assert status.available, status
          assert set(status.backends) == set(
              os.environ["EXPECTED_BACKENDS"].split(",")
          ), status
          lhs = torch.tensor([[[1, 2, 3, 4]]], dtype=torch.int64)
          parameters = torch.zeros((8, 1), dtype=torch.int64)
          parameters[0, 0] = 34
          actual = torch.ops.fhelium_rns_ops.add_standard(
              lhs, lhs, parameters
          )
          expected = torch.tensor([[[2, 4, 6, 8]]], dtype=torch.int64)
          assert torch.equal(actual, expected)
          PY
            done
          done
  verify-public-windows:
    if: inputs.mode == 'publish'
    needs: [prepare-release, publish]
    runs-on: [self-hosted, Windows, X64, fhelium-release, gpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare-release.outputs.source_commit }}
      - name: Verify public Windows wheels
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Resolve-Python([string] $version) {
            $installKeys = @(
              "Registry::HKEY_LOCAL_MACHINE\Software\Python\PythonCore\$version\InstallPath",
              "Registry::HKEY_CURRENT_USER\Software\Python\PythonCore\$version\InstallPath"
            )
            foreach ($installKey in $installKeys) {
              if (-not (Test-Path $installKey)) { continue }
              $installRoot = (Get-Item $installKey).GetValue('')
              $candidate = Join-Path $installRoot 'python.exe'
              if (-not (Test-Path $candidate -PathType Leaf)) { continue }
              & $candidate -I -c `
                'import platform,sys; expected=sys.argv[1]; actual=str(sys.version_info.major)+chr(46)+str(sys.version_info.minor); raise SystemExit(0 if actual == expected and platform.machine().upper() == sys.argv[2] else 1)' `
                $version AMD64
              if ($LASTEXITCODE -eq 0) {
                return $candidate
              }
            }
            throw "CPython $version AMD64 is not registered for this runner"
          }
          $py312 = Resolve-Python '3.12'
          $py313 = Resolve-Python '3.13'
          $physicalWorkRoot = Join-Path $env:RUNNER_TEMP `
            'fhelium-windows-public-verification'
          New-Item -ItemType Directory -Force $physicalWorkRoot | Out-Null
          $workDrive = 'V:'
          if (Test-Path "$workDrive\") {
            throw "$workDrive is already in use"
          }
          & subst.exe $workDrive $physicalWorkRoot
          if ($LASTEXITCODE -ne 0) {
            throw 'failed to map the public verification root'
          }
          $workRoot = "$workDrive\"
          try {
            Remove-Item -Recurse -Force "$workRoot*" `
              -ErrorAction SilentlyContinue
            $driverEnvironment = Join-Path $workRoot 'driver-environment'
            & $py312 -I -m venv --copies $driverEnvironment
            if ($LASTEXITCODE -ne 0) {
              throw 'failed to create the public verification driver'
            }
            $driverPython = Join-Path $driverEnvironment 'Scripts\python.exe'
            & $driverPython -I -m pip install --only-binary=:all: `
              'jsonschema==4.26.0'
            if ($LASTEXITCODE -ne 0) {
              throw 'failed to install the matrix validator'
            }
            & $driverPython -I packaging/verify_public_windows.py `
              --python-312 $py312 `
              --python-313 $py313 `
              --work-root $workRoot `
              --version '${{ needs.prepare-release.outputs.version }}'
            if ($LASTEXITCODE -ne 0) {
              throw 'public Windows wheel verification failed'
            }
            Remove-Item -Recurse -Force "$workRoot*" `
              -ErrorAction SilentlyContinue
          } finally {
            & subst.exe $workDrive /D
            if ($LASTEXITCODE -ne 0) {
              throw 'failed to remove the public verification mapping'
            }
          }
          Remove-Item -Recurse -Force $physicalWorkRoot

  prepare-github-release-assets:
    if: inputs.mode == 'publish'
    needs: [prepare-release, publish, verify-public-windows]
    runs-on: [self-hosted, linux, x64, fhelium-release, gpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare-release.outputs.source_commit }}
          fetch-depth: 0
      - name: Restore release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fhelium-${{ needs.prepare-release.outputs.source_commit }}
          path: ${{ env.RELEASE_OUTPUT }}
      - name: Prepare GitHub Release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.source_commit }}
        run: |
          set -euo pipefail
          python packaging/release_identity.py \
            --tag "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --remote origin
          git switch --detach
          cp \
            "$RELEASE_OUTPUT/prepared-site/install-catalog.json" \
            docs/.vitepress/theme/data/install-catalog.json
          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git add docs/.vitepress/theme/data/install-catalog.json
          git commit -m "docs: publish FHElium $RELEASE_TAG install recipes"
          git format-patch -1 HEAD \
            --stdout \
            > "$RELEASE_OUTPUT/install-catalog.patch"
          git switch --detach "$SOURCE_COMMIT"
          release_assets="$RELEASE_OUTPUT/github-release"
          mkdir -p "$release_assets"
          cp "$RELEASE_OUTPUT"/sdist/* "$release_assets/"
          cp \
            "$RELEASE_OUTPUT/prepared-site/release-manifest.json" \
            "$release_assets/"
          cp "$RELEASE_OUTPUT/install-catalog.patch" "$release_assets/"
      - name: Preserve GitHub Release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fhelium-github-release-${{ inputs.tag }}
          path: ${{ env.RELEASE_OUTPUT }}/github-release/*
          if-no-files-found: error
          retention-days: 30
