name: Release FHElium

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build and verify artifacts, or publish after verification
        required: true
        default: build-only
        type: choice
        options: [build-only, publish]
      build_scope:
        description: Build the complete matrix or only the Windows matrix
        required: true
        default: all
        type: choice
        options: [all, windows-only]
      source_ref:
        description: Branch, commit SHA, or tag to build in build-only mode
        required: false
        default: testing
        type: string
      tag:
        description: Existing release tag required only in publish mode
        required: false
        default: ''
        type: string
      reuse_build_run:
        description: Existing run with successful Linux and Windows builds of this source (all scope only)
        required: false
        default: ''
        type: string
      initialize_configurations:
        description: Comma-separated configuration roots allowed to be new and absent
        required: false
        default: ''
        type: string
run-name: FHElium ${{ inputs.mode }} ${{ inputs.build_scope }} ${{ inputs.mode == 'publish' && inputs.tag || inputs.source_ref }}

permissions:
  contents: read
  actions: read

concurrency:
  group: fhelium-release
  cancel-in-progress: false

env:
  RELEASE_OUTPUT: ${{ github.workspace }}/release-output

jobs:
  resolve-source:
    runs-on: [self-hosted, linux, x64, fhelium-release, gpu]
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_commit: ${{ steps.version.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.mode == 'publish' && inputs.tag || inputs.source_ref }}
          fetch-depth: 0
      - name: Validate source identity and matrix
        id: version
        shell: bash
        env:
          BUILD_SCOPE: ${{ inputs.build_scope }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          source_commit=$(git rev-parse HEAD)
          if [ "$RELEASE_MODE" = publish ]; then
            if [ "$BUILD_SCOPE" != all ]; then
              echo 'publish mode requires build_scope=all' >&2
              exit 1
            fi
            if [ -z "$RELEASE_TAG" ]; then
              echo 'publish mode requires tag' >&2
              exit 1
            fi
            version=$(python packaging/release_identity.py \
              --tag "$RELEASE_TAG" \
              --source-commit "$source_commit" \
              --remote origin)
          else
            if [ -z "$SOURCE_REF" ]; then
              echo 'build-only mode requires source_ref' >&2
              exit 1
            fi
            version=$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              print(tomllib.load(stream)["project"]["version"])
          PY
            )
          fi
          printf 'version=%s\nsource_commit=%s\n' \
            "$version" "$source_commit" >> "$GITHUB_OUTPUT"
          validation_root="$RUNNER_TEMP/fhelium-source-validation"
          rm -rf "$validation_root"
          python -m venv "$validation_root"
          validation_python="$validation_root/bin/python"
          "$validation_python" -I -m pip install --only-binary=:all: \
            "jsonschema==4.26.0"
          "$validation_python" -I packaging/matrix.py validate
          rm -rf "$validation_root"
      - name: Validate reusable build run
        if: inputs.reuse_build_run != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_BUILD_RUN: ${{ inputs.reuse_build_run }}
          BUILD_SCOPE: ${{ inputs.build_scope }}
          SOURCE_COMMIT: ${{ steps.version.outputs.source_commit }}
        run: |
          python - <<'PYCODE'
          import json
          import os
          import subprocess

          run_id = os.environ["REUSE_BUILD_RUN"]
          if not run_id.isdecimal() or os.environ["BUILD_SCOPE"] != "all":
              raise SystemExit("reuse_build_run requires a numeric run ID and build_scope=all")
          api = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"

          def get(suffix=""):
              return json.loads(subprocess.check_output(["gh", "api", api + suffix]))

          run = get()
          if run["path"] != ".github/workflows/release.yml" or run["event"] != "workflow_dispatch":
              raise SystemExit("Build artifacts must come from the manually dispatched release workflow")
          if run["status"] != "completed":
              raise SystemExit("The build run must be complete before its artifacts can be reused")
          jobs = {job["name"]: job["conclusion"] for job in get("/jobs?per_page=100")["jobs"]}
          if any(jobs.get(name) != "success" for name in ("build-linux", "build-windows")):
              raise SystemExit("Both platform build and installed-wheel verification jobs must have succeeded")
          artifacts = get("/artifacts?per_page=100")["artifacts"]
          for platform in ("linux", "windows"):
              name = f"fhelium-{platform}-{os.environ['SOURCE_COMMIT']}"
              matches = [artifact for artifact in artifacts if artifact["name"] == name and not artifact["expired"]]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one unexpired source-matching artifact: {name}")
          print(f"Reusing verified builds from run {run_id}; source {os.environ['SOURCE_COMMIT']}")
          PYCODE

  verify-project:
    if: inputs.build_scope == 'all'
    needs: resolve-source
    runs-on: [self-hosted, linux, x64, fhelium-release, gpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-source.outputs.source_commit }}
          fetch-depth: 0
      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail
          verification_root="$RUNNER_TEMP/fhelium-project-verification"
          rm -rf "$verification_root"
          python -m venv "$verification_root"
          verification_python="$verification_root/bin/python"
          "$verification_python" -I -m pip install --only-binary=:all: \
            "jsonschema==4.26.0"
          configuration=$(
            "$verification_python" -I packaging/matrix.py show torch213-cu130
          )
          torch_requirement=$("$verification_python" -c \
            'import json,sys; print(json.load(sys.stdin)["torch_requirement"])' \
            <<<"$configuration")
          torch_index_url=$("$verification_python" -c \
            'import json,sys; print(json.load(sys.stdin)["torch_index_url"])' \
            <<<"$configuration")
          "$verification_python" -I -m pip install \
            --index-url "$torch_index_url" "$torch_requirement"
          "$verification_python" -I -m pip install \
            --group build --group dev --no-build-isolation
          "$verification_python" -I -m pip install \
            --editable . --no-build-isolation --no-cache-dir
          "$verification_python" -I -m ruff check \
            fhelium tests examples scripts packaging
          # Formatting is reported without invalidating immutable release artifacts.
          if ! "$verification_python" -I -m ruff format --check \
            fhelium tests examples scripts packaging; then
            echo '::warning::Source formatting differs from Ruff output; see the formatting report above.'
          fi
          "$verification_python" -I -m pyright
          "$verification_python" -I -m pytest -q
          "$verification_python" -I -m pytest \
            packaging/test_release_repository.py -q
          npm --prefix docs ci
          npm --prefix docs run build
          git diff --check
          rm -rf "$verification_root"

  build-linux:
    if: inputs.build_scope == 'all' && inputs.reuse_build_run == ''
    needs: resolve-source
    runs-on: [self-hosted, linux, x64, fhelium-release, gpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-source.outputs.source_commit }}
          fetch-depth: 0
      - name: Build Linux wheels
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RELEASE_OUTPUT"
          driver_root="$RUNNER_TEMP/fhelium-linux-release-driver"
          rm -rf "$driver_root"
          python -m venv "$driver_root"
          driver_python="$driver_root/bin/python"
          "$driver_python" -I -m pip install --only-binary=:all: \
            "build==1.5.0" \
            "jsonschema==4.26.0" \
            "scikit-build-core==1.0.3" \
            "twine==6.2.0"
          docker build --file packaging/manylinux_2_28.Dockerfile \
            --tag fhelium-manylinux-cpu .
          docker build --file packaging/manylinux_2_28_cuda12_9.Dockerfile \
            --tag fhelium-manylinux-cuda-12.9 .
          docker build --file packaging/manylinux_2_28_cuda13.Dockerfile \
            --tag fhelium-manylinux-cuda-13.0 .
          work_root="$RUNNER_TEMP/fhelium-linux-release-build"
          "$driver_python" -I packaging/matrix.py cells \
            --platform manylinux_2_28_x86_64 |
          while read -r configuration platform python_abi; do
            "$driver_python" -I packaging/build_wheel.py \
              --platform "$platform" \
              --configuration "$configuration" \
              --python-abi "$python_abi" \
              --work-root "$work_root" \
              --output "$RELEASE_OUTPUT" \
              --verify-install
          done
      - name: Build source distribution
        shell: bash
        run: |
          set -euo pipefail
          driver_root="$RUNNER_TEMP/fhelium-linux-release-driver"
          driver_python="$driver_root/bin/python"
          "$driver_python" -I -m build \
            --sdist --no-isolation --outdir "$RELEASE_OUTPUT/sdist"
          "$driver_python" -I -m twine check "$RELEASE_OUTPUT"/sdist/*
          rm -rf \
            "$RUNNER_TEMP/fhelium-linux-release-build" \
            "$driver_root"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fhelium-linux-${{ needs.resolve-source.outputs.source_commit }}
          path: ${{ env.RELEASE_OUTPUT }}/**
          if-no-files-found: error
          retention-days: 30

  build-windows:
    if: inputs.reuse_build_run == ''
    needs: resolve-source
    runs-on: [self-hosted, Windows, X64, fhelium-release, gpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-source.outputs.source_commit }}
          fetch-depth: 0
      - name: Build Windows wheels
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force $env:RELEASE_OUTPUT -ErrorAction SilentlyContinue
          function Resolve-Python([string] $version) {
            $installKeys = @(
              "Registry::HKEY_LOCAL_MACHINE\Software\Python\PythonCore\$version\InstallPath",
              "Registry::HKEY_CURRENT_USER\Software\Python\PythonCore\$version\InstallPath"
            )
            foreach ($installKey in $installKeys) {
              if (-not (Test-Path $installKey)) { continue }
              $installRoot = (Get-Item $installKey).GetValue('')
              $candidate = Join-Path $installRoot 'python.exe'
              if (-not (Test-Path $candidate -PathType Leaf)) { continue }
              & $candidate -I -c `
                'import platform,sys; expected=sys.argv[1]; actual=str(sys.version_info.major)+chr(46)+str(sys.version_info.minor); raise SystemExit(0 if actual == expected and platform.machine().upper() == sys.argv[2] else 1)' `
                $version AMD64
              if ($LASTEXITCODE -eq 0) {
                return $candidate
              }
            }
            throw "CPython $version AMD64 is not registered for this runner"
          }
          $py312 = Resolve-Python '3.12'
          $py313 = Resolve-Python '3.13'
          $physicalWorkRoot = Join-Path $env:RUNNER_TEMP `
            'fhelium-windows-release-build'
          New-Item -ItemType Directory -Force $physicalWorkRoot | Out-Null
          $workDrive = 'W:'
          if (Test-Path "$workDrive\") {
            throw "$workDrive is already in use"
          }
          & subst.exe $workDrive $physicalWorkRoot
          if ($LASTEXITCODE -ne 0) { throw 'failed to map the build root' }
          $workRoot = "$workDrive\"
          try {
            Remove-Item -Recurse -Force "$workRoot*" `
              -ErrorAction SilentlyContinue
            $matrixEnvironment = Join-Path $workRoot 'matrix-environment'
            & $py312 -I -m venv --copies $matrixEnvironment
            if ($LASTEXITCODE -ne 0) {
              throw 'failed to create the matrix environment'
            }
            $matrixPython = Join-Path $matrixEnvironment 'Scripts\python.exe'
            & $matrixPython -I -m pip install --only-binary=:all: `
              'jsonschema==4.26.0'
            if ($LASTEXITCODE -ne 0) {
              throw 'failed to install the matrix validator'
            }
            $cellsJson = & $matrixPython -I packaging/matrix.py cells `
              --platform win_amd64 --json
            if ($LASTEXITCODE -ne 0) {
              throw 'failed to read the Windows release cells'
            }
            $cells = $cellsJson | ConvertFrom-Json
            Remove-Item -Recurse -Force $matrixEnvironment
            foreach ($cell in $cells) {
              $python = if ($cell.python_abi -eq 'cp312-cp312') {
                $py312
              } else {
                $py313
              }
              & $python -I packaging/build_wheel.py `
                --platform win_amd64 `
                --configuration $cell.configuration `
                --python-abi $cell.python_abi `
                --python $python `
                --work-root $workRoot `
                --output $env:RELEASE_OUTPUT `
                --verify-install
              if ($LASTEXITCODE -ne 0) {
                throw "Windows cell failed: $($cell.configuration) $($cell.python_abi)"
              }
            }
            Remove-Item -Recurse -Force "$workRoot*" `
              -ErrorAction SilentlyContinue
          } finally {
            & subst.exe $workDrive /D
            if ($LASTEXITCODE -ne 0) {
              throw 'failed to remove the build-root mapping'
            }
          }
          Remove-Item -Recurse -Force $physicalWorkRoot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fhelium-windows-${{ needs.resolve-source.outputs.source_commit }}
          path: ${{ env.RELEASE_OUTPUT }}/**
          if-no-files-found: error
          retention-days: 30

  prepare-release:
    if: >-
      ${{ !cancelled() && inputs.build_scope == 'all' &&
          needs.resolve-source.result == 'success' &&
          needs.verify-project.result == 'success' &&
          ((inputs.reuse_build_run == '' && needs.build-linux.result == 'success' && needs.build-windows.result == 'success') ||
           (inputs.reuse_build_run != '' && needs.build-linux.result == 'skipped' && needs.build-windows.result == 'skipped')) }}
    needs: [resolve-source, verify-project, build-linux, build-windows]
    runs-on: [self-hosted, linux, x64, fhelium-release, gpu]
    outputs:
      version: ${{ needs.resolve-source.outputs.version }}
      source_commit: ${{ needs.resolve-source.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-source.outputs.source_commit }}
          fetch-depth: 0
      - name: Clear candidate workspace
        shell: bash
        run: rm -rf "$RELEASE_OUTPUT"
      - name: Restore verified Linux build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fhelium-linux-${{ needs.resolve-source.outputs.source_commit }}
          run-id: ${{ inputs.reuse_build_run || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.RELEASE_OUTPUT }}
      - name: Restore verified Windows build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fhelium-windows-${{ needs.resolve-source.outputs.source_commit }}
          run-id: ${{ inputs.reuse_build_run || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.RELEASE_OUTPUT }}
      - name: Prepare repository candidate
        shell: bash
        env:
          INITIALIZE_CONFIGURATIONS: ${{ inputs.initialize_configurations }}
        run: |
          set -euo pipefail
          preparation_root="$RUNNER_TEMP/fhelium-release-preparation"
          rm -rf "$preparation_root"
          python -m venv "$preparation_root"
          preparation_python="$preparation_root/bin/python"
          "$preparation_python" -I -m pip install --only-binary=:all: \
            "jsonschema==4.26.0" "packaging==26.3"
          "$preparation_python" packaging/prepare_release.py \
            --input "$RELEASE_OUTPUT" \
            --output "$RELEASE_OUTPUT/prepared-site" \
            --prepared-at "$(git show -s --format=%cI HEAD)"
          merge_args=()
          IFS=',' read -ra initial_roots <<< "$INITIALIZE_CONFIGURATIONS"
          for configuration in "${initial_roots[@]}"; do
            configuration=${configuration//[[:space:]]/}
            if [ -n "$configuration" ]; then
              merge_args+=(--allow-missing-configuration "$configuration")
            fi
          done
          "$preparation_python" packaging/merge_repository.py \
            "$RELEASE_OUTPUT/prepared-site" "${merge_args[@]}"
          "$preparation_python" packaging/repository_check.py \
            "$RELEASE_OUTPUT/prepared-site" --source-commit "$(git rev-parse HEAD)"
          rm -rf "$preparation_root"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fhelium-${{ needs.resolve-source.outputs.source_commit }}
          path: |
            ${{ env.RELEASE_OUTPUT }}/sdist/*
            ${{ env.RELEASE_OUTPUT }}/prepared-site/**
          if-no-files-found: error
          retention-days: 30

  publish:
    if: >-
      ${{ !cancelled() && inputs.mode == 'publish' &&
          needs.prepare-release.result == 'success' }}
    needs: prepare-release
    runs-on: [self-hosted, linux, x64, fhelium-release, gpu]
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare-release.outputs.source_commit }}
          fetch-depth: 0
      - name: Restore release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fhelium-${{ needs.prepare-release.outputs.source_commit }}
          path: ${{ env.RELEASE_OUTPUT }}
      - name: Install publication clients
        shell: bash
        run: |
          set -euo pipefail
          publication_root="$RUNNER_TEMP/fhelium-publication"
          rm -rf "$publication_root"
          python -m venv "$publication_root"
          PUBLICATION_PYTHON="$publication_root/bin/python"
          printf 'PUBLICATION_PYTHON=%s\n' "$PUBLICATION_PYTHON" \
            >> "$GITHUB_ENV"
          "$PUBLICATION_PYTHON" -I -m pip install --only-binary=:all: \
            "awscli==1.46.0" \
            "jsonschema==4.26.0" \
            "twine==6.2.0"
      - name: Validate restored repository
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.source_commit }}
        run: |
          set -euo pipefail
          "$PUBLICATION_PYTHON" packaging/release_identity.py \
            --tag "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --remote origin
          "$PUBLICATION_PYTHON" packaging/repository_check.py \
            "$RELEASE_OUTPUT/prepared-site" \
            --source-commit "$(git rev-parse HEAD)"
          "$PUBLICATION_PYTHON" -I -m twine check "$RELEASE_OUTPUT"/sdist/*
      - name: Validate public Simple Repository routing
        shell: bash
        env:
          INITIALIZE_CONFIGURATIONS: ${{ inputs.initialize_configurations }}
        run: |
          set -euo pipefail
          probe_args=(--expect-subset "$RELEASE_OUTPUT/prepared-site")
          IFS=',' read -ra initial_roots <<< "$INITIALIZE_CONFIGURATIONS"
          for configuration in "${initial_roots[@]}"; do
            configuration=${configuration//[[:space:]]/}
            if [ -n "$configuration" ]; then
              probe_args+=(--allow-missing-configuration "$configuration")
            fi
          done
          "$PUBLICATION_PYTHON" packaging/repository_probe.py \
            "${probe_args[@]}"
      - name: Publish immutable release objects to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          FHELIUM_R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          FHELIUM_R2_BUCKET: ${{ vars.R2_BUCKET }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.source_commit }}
        run: |
          set -euo pipefail
          "$PUBLICATION_PYTHON" packaging/release_identity.py \
            --tag "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --remote origin
          "$PUBLICATION_PYTHON" packaging/publish_release.py \
            "$RELEASE_OUTPUT/prepared-site" \
            --phase artifacts
          "$PUBLICATION_PYTHON" packaging/artifact_probe.py \
            "$RELEASE_OUTPUT/prepared-site/release-manifest.json"
      - name: Validate PyPI release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.source_commit }}
        run: |
          set -euo pipefail
          "$PUBLICATION_PYTHON" packaging/release_identity.py \
            --tag "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --remote origin
          "$PUBLICATION_PYTHON" packaging/pypi_probe.py \
            "$RELEASE_OUTPUT"/sdist/fhelium-*.tar.gz \
            --allow-missing
      - name: Publish source distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-output/sdist/
          print-hash: true
          skip-existing: true
      - name: Verify PyPI release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.source_commit }}
        run: |
          set -euo pipefail
          "$PUBLICATION_PYTHON" packaging/release_identity.py \
            --tag "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --remote origin
          "$PUBLICATION_PYTHON" packaging/pypi_probe.py \
            "$RELEASE_OUTPUT"/sdist/fhelium-*.tar.gz \
            --attempts 24 \
            --interval 5
      - name: Publish cumulative Simple Repository indexes
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          FHELIUM_R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          FHELIUM_R2_BUCKET: ${{ vars.R2_BUCKET }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.source_commit }}
        run: |
          set -euo pipefail
          "$PUBLICATION_PYTHON" packaging/release_identity.py \
            --tag "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --remote origin
          "$PUBLICATION_PYTHON" packaging/publish_release.py \
            "$RELEASE_OUTPUT/prepared-site" \
            --phase indexes
          rm -rf "$(dirname "$(dirname "$PUBLICATION_PYTHON")")"

  verify-public-linux:
    if: >-
      ${{ !cancelled() && inputs.mode == 'publish' &&
          needs.prepare-release.result == 'success' &&
          needs.publish.result == 'success' }}
    needs: [prepare-release, publish]
    runs-on: [self-hosted, linux, x64, fhelium-release, gpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare-release.outputs.source_commit }}
      - name: Verify public Linux wheels
        shell: bash
        run: |
          set -euo pipefail
          work_root="$RUNNER_TEMP/fhelium-linux-public-verification"
          rm -rf "$work_root"
          python3.12 -m venv "$work_root/driver-environment"
          driver_python="$work_root/driver-environment/bin/python"
          "$driver_python" -I -m pip install --only-binary=:all: \
            "jsonschema==4.26.0"
          "$driver_python" -I packaging/verify_public_wheels.py \
            --platform manylinux_2_28_x86_64 \
            --python-312 "$(command -v python3.12)" \
            --python-313 "$(command -v python3.13)" \
            --work-root "$work_root" \
            --version '${{ needs.prepare-release.outputs.version }}'
          rm -rf "$work_root"

  verify-public-windows:
    if: >-
      ${{ !cancelled() && inputs.mode == 'publish' &&
          needs.prepare-release.result == 'success' &&
          needs.publish.result == 'success' }}
    needs: [prepare-release, publish]
    runs-on: [self-hosted, Windows, X64, fhelium-release, gpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare-release.outputs.source_commit }}
      - name: Verify public Windows wheels
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Resolve-Python([string] $version) {
            $installKeys = @(
              "Registry::HKEY_LOCAL_MACHINE\Software\Python\PythonCore\$version\InstallPath",
              "Registry::HKEY_CURRENT_USER\Software\Python\PythonCore\$version\InstallPath"
            )
            foreach ($installKey in $installKeys) {
              if (-not (Test-Path $installKey)) { continue }
              $installRoot = (Get-Item $installKey).GetValue('')
              $candidate = Join-Path $installRoot 'python.exe'
              if (-not (Test-Path $candidate -PathType Leaf)) { continue }
              & $candidate -I -c `
                'import platform,sys; expected=sys.argv[1]; actual=str(sys.version_info.major)+chr(46)+str(sys.version_info.minor); raise SystemExit(0 if actual == expected and platform.machine().upper() == sys.argv[2] else 1)' `
                $version AMD64
              if ($LASTEXITCODE -eq 0) {
                return $candidate
              }
            }
            throw "CPython $version AMD64 is not registered for this runner"
          }
          $py312 = Resolve-Python '3.12'
          $py313 = Resolve-Python '3.13'
          $physicalWorkRoot = Join-Path $env:RUNNER_TEMP `
            'fhelium-windows-public-verification'
          New-Item -ItemType Directory -Force $physicalWorkRoot | Out-Null
          $workDrive = 'V:'
          if (Test-Path "$workDrive\") {
            throw "$workDrive is already in use"
          }
          & subst.exe $workDrive $physicalWorkRoot
          if ($LASTEXITCODE -ne 0) {
            throw 'failed to map the public verification root'
          }
          $workRoot = "$workDrive\"
          try {
            Remove-Item -Recurse -Force "$workRoot*" `
              -ErrorAction SilentlyContinue
            $driverEnvironment = Join-Path $workRoot 'driver-environment'
            & $py312 -I -m venv --copies $driverEnvironment
            if ($LASTEXITCODE -ne 0) {
              throw 'failed to create the public verification driver'
            }
            $driverPython = Join-Path $driverEnvironment 'Scripts\python.exe'
            & $driverPython -I -m pip install --only-binary=:all: `
              'jsonschema==4.26.0'
            if ($LASTEXITCODE -ne 0) {
              throw 'failed to install the matrix validator'
            }
            & $driverPython -I packaging/verify_public_wheels.py `
              --platform win_amd64 `
              --python-312 $py312 `
              --python-313 $py313 `
              --work-root $workRoot `
              --version '${{ needs.prepare-release.outputs.version }}'
            if ($LASTEXITCODE -ne 0) {
              throw 'public Windows wheel verification failed'
            }
            Remove-Item -Recurse -Force "$workRoot*" `
              -ErrorAction SilentlyContinue
          } finally {
            & subst.exe $workDrive /D
            if ($LASTEXITCODE -ne 0) {
              throw 'failed to remove the public verification mapping'
            }
          }
          Remove-Item -Recurse -Force $physicalWorkRoot

  prepare-github-release-assets:
    if: >-
      ${{ !cancelled() && inputs.mode == 'publish' &&
          needs.prepare-release.result == 'success' &&
          needs.publish.result == 'success' &&
          needs.verify-public-linux.result == 'success' &&
          needs.verify-public-windows.result == 'success' }}
    needs: [prepare-release, publish, verify-public-linux, verify-public-windows]
    runs-on: [self-hosted, linux, x64, fhelium-release, gpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare-release.outputs.source_commit }}
          fetch-depth: 0
      - name: Restore release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fhelium-${{ needs.prepare-release.outputs.source_commit }}
          path: ${{ env.RELEASE_OUTPUT }}
      - name: Prepare GitHub Release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.source_commit }}
        run: |
          set -euo pipefail
          python packaging/release_identity.py \
            --tag "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --remote origin
          cp \
            "$RELEASE_OUTPUT/prepared-site/install-catalog.json" \
            docs/.vitepress/theme/data/install-catalog.json
          git diff --binary --full-index -- \
            docs/.vitepress/theme/data/install-catalog.json \
            > "$RELEASE_OUTPUT/install-catalog.patch"
          git restore --source=HEAD -- \
            docs/.vitepress/theme/data/install-catalog.json
          release_assets="$RELEASE_OUTPUT/github-release"
          mkdir -p "$release_assets"
          cp "$RELEASE_OUTPUT"/sdist/* "$release_assets/"
          cp \
            "$RELEASE_OUTPUT/prepared-site/release-manifest.json" \
            "$release_assets/"
          cp "$RELEASE_OUTPUT/install-catalog.patch" "$release_assets/"
      - name: Preserve GitHub Release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fhelium-github-release-${{ inputs.tag }}
          path: ${{ env.RELEASE_OUTPUT }}/github-release/*
          if-no-files-found: error
          retention-days: 30
