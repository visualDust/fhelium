[pytest]
addopts =
    --ignore=tests/ignored/
    --ignore=third_party/
    --capture=tee-sys
markers =
    gpu: tests that require at least one CUDA device
    multigpu: tests that require at least two CUDA devices
    pinned_memory: tests that require a PyTorch pinned-host allocator
    slow: tests that are useful locally but may be slower than pure unit tests
